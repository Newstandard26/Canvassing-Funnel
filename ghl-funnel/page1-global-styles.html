<!-- ============================================================= -->
<!-- NSR 30 to 300 — GLOBAL STYLES BLOCK                            -->
<!-- Place this as the FIRST 1-column, full-width Custom HTML block -->
<!-- at the very top of Page 1 (reuse on Page 2 if you like).       -->
<!-- Loads Google Fonts, CSS variables, shared animations, and      -->
<!-- themes the GHL native form to match the reference design.      -->
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #090909; --gray1: #111; --gray2: #1a1a1a;
    --teal: #3AB5C0; --teal-dark: #1f8c96;
    --white: #fff; --muted: rgba(255,255,255,0.55);
  }

  /* Force the funnel page dark so there are no white gaps between
     custom HTML rows. (Also set page bg to #090909 in GHL page
     settings — this is a fallback.) */
  body, #wrapper, .container-fluid, .c-section, .row-fluid, .row {
    background-color: var(--black) !important;
  }
  html { scroll-behavior: smooth; }

  /* Shared animations used by the hero / thank-you / recorder blocks */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @keyframes blink    { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ---- Theme the GHL native form to match the reference card ----
     GHL renders the form into .hl-form / form[id^="form-"]. These
     selectors restyle it without touching the form builder. Adjust
     if your form wrapper class differs (check DevTools). */
  .hl-form, form[id^="form-"] {
    background: var(--gray1) !important;
    border: 1px solid rgba(58,181,192,0.2) !important;
    padding: 40px !important;
    font-family: 'Barlow', sans-serif !important;
    max-width: 820px; margin: 0 auto;
  }
  .hl-form label, form[id^="form-"] label {
    font-size: 11px !important; font-weight: 700 !important;
    letter-spacing: 2px !important; color: var(--teal) !important;
    text-transform: uppercase !important;
    font-family: 'Barlow', sans-serif !important;
  }
  .hl-form input, .hl-form select,
  form[id^="form-"] input, form[id^="form-"] select {
    background: rgba(255,255,255,0.05) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    color: var(--white) !important;
    font-size: 16px !important; padding: 14px 16px !important;
    border-radius: 0 !important;
  }
  .hl-form input:focus, form[id^="form-"] input:focus {
    border-color: var(--teal) !important;
    background: rgba(58,181,192,0.05) !important;
  }
  .hl-form input::placeholder, form[id^="form-"] input::placeholder {
    color: rgba(255,255,255,0.25) !important;
  }
  .hl-form input[type="date"]::-webkit-calendar-picker-indicator,
  form[id^="form-"] input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
  }
  /* GHL submit button — Bebas, teal, full width (matches .submit-btn) */
  .hl-form button[type="submit"], .hl-form .hl-btn,
  form[id^="form-"] button[type="submit"] {
    width: 100% !important;
    background: var(--teal) !important; color: var(--white) !important;
    border: none !important; border-radius: 0 !important;
    font-family: 'Bebas Neue', sans-serif !important;
    font-size: 24px !important; letter-spacing: 4px !important;
    padding: 20px !important; text-transform: uppercase !important;
  }
  .hl-form button[type="submit"]:hover,
  form[id^="form-"] button[type="submit"]:hover {
    background: var(--teal-dark) !important;
  }
</style>
